services:
  db:
    image: postgres:16
    container_name: traider-test-db
    environment:
      POSTGRES_USER: traider
      POSTGRES_PASSWORD: traider_test_pass
      POSTGRES_DB: inventory
    ports:
      - "5437:5432"
    volumes:
      - traider_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traider -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traider-test-backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://traider:traider_test_pass@db:5432/inventory
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  traider_test_data:
